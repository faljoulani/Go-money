trigger:
  branches:
    include:
      - main
      - feature/*

variables:
  artifactName: 'gomoney-fe'
  feSiteName: 'fe1-dev-gomoney.ddns.net'
  feSiteRoot: 'C:\\inetpub\\wwwroot\\fe1-dev-gomoney.ddns.net'

  # Container bits (kept local on the VM)
  feImageName: 'fe-gomoney'
  feContainer: 'fe-gomoney'
  fePort: 9097

stages:
  # -------------------- BUILD --------------------
  - stage: Build
    displayName: Build & Package Frontend (Linux container)
    jobs:
      - job: Build
        pool:
          vmImage: 'ubuntu-latest'
        workspace:
          clean: all
        steps:
          - checkout: self
            clean: true
            fetchDepth: 0

          - task: NodeTool@0
            inputs:
              versionSpec: '20.x'
            displayName: 'Install Node.js'

          - script: |
              set -e
              npm ci --no-audit --no-fund
            displayName: 'Install dependencies'

          - script: |
              set -euo pipefail
              echo "Creating Linux-only case aliases (no repo changes)"

              # MainNavigation.entity (import expects Uppercase, file is lowercase)
              if [ -f src/components/widgets/mainNavigation/mainNavigation.entity.ts ] && [ ! -f src/components/widgets/mainNavigation/MainNavigation.entity.ts ]; then
                printf "export * from './mainNavigation.entity';\nexport { default } from './mainNavigation.entity';\n" > src/components/widgets/mainNavigation/MainNavigation.entity.ts
              fi

              # MainNavigationClient (import expects Uppercase, file is lowercase)
              if [ -f src/components/widgets/mainNavigation/mainNavigationClient.tsx ] && [ ! -f src/components/widgets/mainNavigation/MainNavigationClient.tsx ]; then
                printf "export { default } from './mainNavigationClient';\n" > src/components/widgets/mainNavigation/MainNavigationClient.tsx
              fi

              # breadcrumbCustom (import expects lowercase, file is Uppercase)
              if [ -f src/components/widgets/breadcrumb/BreadcrumbCustom.tsx ] && [ ! -f src/components/widgets/breadcrumb/breadcrumbCustom.tsx ]; then
                printf "export { default } from './BreadcrumbCustom';\n" > src/components/widgets/breadcrumb/breadcrumbCustom.tsx
              fi

              # supportInfoBox directory (import expects lowercase dir)
              if [ -d src/components/widgets/SupportInfoBox ] && [ ! -e src/components/widgets/supportInfoBox ]; then
                (cd src/components/widgets && ln -s SupportInfoBox supportInfoBox)
              fi

              # TwoColumnLayout (import expects Uppercase file, file is lowercase)
              if [ -f src/components/widgets/layouts/twoColumnLayout.tsx ] && [ ! -f src/components/widgets/layouts/TwoColumnLayout.tsx ]; then
                printf "export { default } from './twoColumnLayout';\nexport * from './twoColumnLayout';\n" > src/components/widgets/layouts/TwoColumnLayout.tsx
              fi

              # ContactSubscription.entity (import expects Uppercase, file is lowercase)
              if [ -f src/components/widgets/contactSubscription/contactSubscription.entity.ts ] && [ ! -f src/components/widgets/contactSubscription/ContactSubscription.entity.ts ]; then
                printf "export * from './contactSubscription.entity';\n" > src/components/widgets/contactSubscription/ContactSubscription.entity.ts
              fi

              # FullPageLoader (import expects Uppercase file, file is lowercase)
              if [ -f src/components/atoms/fullPageLoader/fullPageLoader.tsx ] && [ ! -f src/components/atoms/fullPageLoader/FullPageLoader.tsx ]; then
                printf "export { default } from './fullPageLoader';\n" > src/components/atoms/fullPageLoader/FullPageLoader.tsx
              fi

              # ContentWithoutImage (import expects Uppercase file, file is lowercase)
              if [ -f src/components/widgets/highlightBlock/contentWithoutImage.tsx ] && [ ! -f src/components/widgets/highlightBlock/ContentWithoutImage.tsx ]; then
                printf "export { default } from './contentWithoutImage';\n" > src/components/widgets/highlightBlock/ContentWithoutImage.tsx
              fi
            displayName: 'Create case-insensitive aliases for Linux build'

          - script: |
              set -e
              npm run build
            displayName: 'Build frontend'

          # Keep Docker build context small & predictable
          - script: |
              set -e
              DEST="$(Build.ArtifactStagingDirectory)/drop"
              mkdir -p "$DEST"

              cp -R "$(Build.SourcesDirectory)/src"    "$DEST/"
              cp -R "$(Build.SourcesDirectory)/public" "$DEST/"

              cp    "$(Build.SourcesDirectory)/package.json"      "$DEST/"
              cp    "$(Build.SourcesDirectory)/package-lock.json" "$DEST/"
              cp    "$(Build.SourcesDirectory)/next.config.js"    "$DEST/"
              # Use the Linux container Dockerfile
              cp    "$(Build.SourcesDirectory)/Dockerfile"        "$DEST/Dockerfile"

              # **** IMPORTANT: include TS config so Docker build targets ES2018+ ****
              [ -f "$(Build.SourcesDirectory)/tsconfig.json" ]  && cp "$(Build.SourcesDirectory)/tsconfig.json"  "$DEST/" || true
              [ -f "$(Build.SourcesDirectory)/next-env.d.ts" ]  && cp "$(Build.SourcesDirectory)/next-env.d.ts"  "$DEST/" || true

              # Optional but harmless: carry common configs used by build tools
              [ -f "$(Build.SourcesDirectory)/eslint.config.js" ] && cp "$(Build.SourcesDirectory)/eslint.config.js" "$DEST/" || true
              [ -f "$(Build.SourcesDirectory)/.editorconfig" ]    && cp "$(Build.SourcesDirectory)/.editorconfig"    "$DEST/" || true
              [ -f "$(Build.SourcesDirectory)/.npmrc" ]           && cp "$(Build.SourcesDirectory)/.npmrc"           "$DEST/" || true

              [ -f "$(Build.SourcesDirectory)/.dockerignore" ]    && cp "$(Build.SourcesDirectory)/.dockerignore"    "$DEST/" || true
              [ -f "$(Build.SourcesDirectory)/.env.production" ]  && cp "$(Build.SourcesDirectory)/.env.production"  "$DEST/" || true
              [ -f "$(Build.SourcesDirectory)/web.config" ]       && cp "$(Build.SourcesDirectory)/web.config"       "$DEST/" || true

              # Include Tailwind/PostCSS configs so Docker build can generate CSS
              [ -f "$(Build.SourcesDirectory)/postcss.config.js" ]  && cp "$(Build.SourcesDirectory)/postcss.config.js"  "$DEST/" || true
              [ -f "$(Build.SourcesDirectory)/tailwind.config.ts" ] && cp "$(Build.SourcesDirectory)/tailwind.config.ts" "$DEST/" || true
              [ -f "$(Build.SourcesDirectory)/tailwind.config.js" ] && cp "$(Build.SourcesDirectory)/tailwind.config.js" "$DEST/" || true
            displayName: 'Prepare FE artifacts'

          - task: PublishBuildArtifacts@1
            displayName: 'Publish FE artifact'
            inputs:
              PathtoPublish: '$(Build.ArtifactStagingDirectory)/drop'
              ArtifactName: '$(artifactName)'
              publishLocation: 'Container'

  # -------------------- DEPLOY --------------------
  - stage: Deploy_Dev
    displayName: Deploy FE to Gomoney-Dev (Linux container)
    dependsOn: Build
    jobs:
      - job: WaitForApproval
        displayName: 'Approval: Deploy FE to Gomoney-Dev'
        pool: server
        steps:
          - task: ManualValidation@0
            inputs:
              instructions: |
                Review the FE build. Approve to deploy to the DEV VM.
                This will build the Docker image on the VM and (re)start the container.
              onTimeout: 'reject'
              timeout: '12:00:00'

      - deployment: DeployToVM
        displayName: 'Build & Run FE container on DEV VM (Linux)'
        dependsOn: WaitForApproval
        environment:
          name: 'Gomoney-Dev'
          resourceType: 'virtualMachine'
          resourceName: 'SC-WORKSTATION'
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: none

                - powershell: |
                    Write-Host "Agent machine: $env:COMPUTERNAME"
                    Write-Host "Docker info (mode)"
                    docker info --format '{{json .ServerInfo}}' | Out-String | Write-Host
                  displayName: 'Log Docker mode/info'

                - powershell: |
                    # Clean deploy workspace
                    $path = "$(Pipeline.Workspace)\$(artifactName)"
                    if (Test-Path $path) { Remove-Item -Recurse -Force $path }
                    New-Item -ItemType Directory -Path $path | Out-Null
                  displayName: 'Pre-clean deploy workspace'

                - task: DownloadPipelineArtifact@2
                  displayName: 'Download FE artifact (this run)'
                  inputs:
                    buildType: current
                    artifactName: '$(artifactName)'
                    targetPath: '$(Pipeline.Workspace)\$(artifactName)'
                    cleanDestinationFolder: true

                - powershell: |
                    $ctx = "$(Pipeline.Workspace)\$(artifactName)"
                    Write-Host "Scanning $ctx for known-stale files..."
                    $bad = Get-ChildItem -Path $ctx -Recurse -File -Filter 'card-section.entity.ts' -ErrorAction SilentlyContinue
                    if ($bad) {
                      $bad | ForEach-Object { Write-Host "FOUND STALE: $($_.FullName)" }
                      throw "Found stale file(s) in downloaded artifact."
                    } else {
                      Write-Host "Artifact $(artifactName) is clean."
                    }
                  displayName: 'Guard: detect stale file'

                - powershell: |
                    $ctx    = "$(Pipeline.Workspace)\$(artifactName)"
                    $tag    = "$(Build.BuildId)"
                    $image  = "$(feImageName):$tag"
                    $latest = "$(feImageName):latest"
                    $cname  = "$(feContainer)"
                    $port   = [int]"$(fePort)"

                    Write-Host "Docker build context: $ctx"
                    Push-Location $ctx

                    # Always rewrite .env.production from pipeline variables
                    $envPath  = Join-Path $ctx ".env.production"
                    $sfCmsUrl = "$(SF_CMS_URL)"   # must include http:// or https://
                    $lines = @()
                    if (-not [string]::IsNullOrWhiteSpace($sfCmsUrl)) { $lines += "SF_CMS_URL=$sfCmsUrl" }
                    $lines += "NODE_ENV=production"
                    $content = ($lines -join "`r`n") + "`r`n"
                    Set-Content -LiteralPath $envPath -Value $content -Encoding UTF8 -Force
                    Write-Host "Wrote $envPath with:"
                    Get-Content $envPath | ForEach-Object { '  ' + $_ }

                    # If you keep a web.config in repo, copy it to IIS path now
                    $wcFrom = Join-Path $ctx 'web.config'
                    if (Test-Path $wcFrom) {
                      if (-not (Test-Path "$(feSiteRoot)")) {
                        New-Item -ItemType Directory -Path "$(feSiteRoot)" | Out-Null
                      }
                      Copy-Item -Path $wcFrom -Destination "$(feSiteRoot)\web.config" -Force
                    }

                    # Build Linux image locally on the VM using Dockerfile
                    docker build -f Dockerfile -t $image .

                    if ($LASTEXITCODE -ne 0) {
                      Write-Error "docker build failed with code $LASTEXITCODE"
                      exit $LASTEXITCODE
                    }

                    docker tag $image $latest

                    # Stop/remove previous container if exists
                    $existing = (docker ps -aq -f "name=$cname")
                    if ($existing) {
                      docker stop $cname | Out-Null
                      docker rm   $cname | Out-Null
                    }

                    # Ensure host port is free (remove any container publishing host port $port)
                    try {
                      $all = docker ps -aq
                      foreach($id in $all){
                        try {
                          $ins = docker inspect $id | ConvertFrom-Json
                          $ports = $ins[0].NetworkSettings.Ports
                          if ($ports -ne $null) {
                            foreach($prop in $ports.PSObject.Properties){
                              $mappings = $prop.Value
                              if ($mappings -ne $null) {
                                foreach($m in $mappings){
                                  if ($m.HostPort -eq $port.ToString()) {
                                    Write-Host "Freeing host port $($port): removing container $id"
                                    docker stop $id | Out-Null
                                    docker rm   $id | Out-Null
                                  }
                                }
                              }
                            }
                          }
                        } catch {}
                      }
                    } catch { Write-Host "Port cleanup skipped: $($_.Exception.Message)" }

                    # Map CMS host to a resolved IPv4 (helps DNS inside container)
                    try { $cmsHost = ([Uri]$sfCmsUrl).Host } catch { $cmsHost = $null }
                    $extraHostArg = ""
                    if (-not [string]::IsNullOrWhiteSpace($cmsHost)) {
                      try {
                        $cmsIp = ([System.Net.Dns]::GetHostAddresses($cmsHost) |
                                  Where-Object { $_.AddressFamily -eq 'InterNetwork' } |
                                  Select-Object -First 1).IPAddressToString
                      } catch { $cmsIp = $null }
                      if (-not [string]::IsNullOrWhiteSpace($cmsIp)) {
                        $extraHostArg = "--add-host=$($cmsHost):$($cmsIp)"
                        Write-Host "Will map $cmsHost -> $cmsIp"
                      } else {
                        Write-Host "DNS failed for $cmsHost on host; running without --add-host."
                      }
                    }

                    # Run container; inject env directly
                    docker run -d --name $cname `
                      -p ${port}:9097 `
                      -e SF_CMS_URL="$sfCmsUrl" `
                      -e NODE_ENV=production `
                      $extraHostArg `
                      --restart unless-stopped `
                      $latest

                    if ($LASTEXITCODE -ne 0) {
                      Write-Error "docker run failed with code $LASTEXITCODE"
                      exit $LASTEXITCODE
                    }

                    Pop-Location
                  displayName: 'docker build & run (local, no registry)'

                - powershell: |
                    Import-Module WebAdministration
                    try {
                      Restart-WebAppPool -Name "DefaultAppPool" -ErrorAction SilentlyContinue
                    } catch {}
                  displayName: 'Recycle IIS (optional)'
