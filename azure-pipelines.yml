trigger:
  - main

variables:
  # Names/paths – change if yours differ
  artifactName: 'gomoney-fe'
  feSiteName: 'fe1-dev-gomoney.ddns.net'
  feSiteRoot: 'C:\inetpub\wwwroot\fe1-dev-gomoney.ddns.net'

  # Container bits (kept local on the VM)
  feImageName: 'fe-gomoney'        # local docker image name
  feContainer: 'fe-gomoney'        # local docker container name
  fePort: 3000                      # container/node port the app listens on

stages:
# -------------------- BUILD --------------------
- stage: Build
  displayName: Build & Package Frontend
  jobs:
  - job: Build
    pool:
      vmImage: 'windows-latest'
    steps:
    - task: NodeTool@0
      inputs:
        # Use Node 20.x (or change to match your FE)
        versionSpec: '20.x'
      displayName: 'Install Node.js'

    # Install & build
    - script: |
        npm ci
        npm run build
      displayName: 'Build frontend'

    # Prepare artifact for the VM to "docker build ." there
    # We include only what docker build needs as context.
    - script: |
        mkdir "$(Build.ArtifactStagingDirectory)\drop"

        rem Copy files needed by Dockerfile context
        xcopy /E /I /Y "$(Build.SourcesDirectory)\src"                      "$(Build.ArtifactStagingDirectory)\drop\src"
        xcopy /E /I /Y "$(Build.SourcesDirectory)\public"                   "$(Build.ArtifactStagingDirectory)\drop\public"
        copy  /Y       "$(Build.SourcesDirectory)\package.json"             "$(Build.ArtifactStagingDirectory)\drop\"
        copy  /Y       "$(Build.SourcesDirectory)\package-lock.json"        "$(Build.ArtifactStagingDirectory)\drop\"
        copy  /Y       "$(Build.SourcesDirectory)\next.config.js"           "$(Build.ArtifactStagingDirectory)\drop\"
        copy  /Y       "$(Build.SourcesDirectory)\Dockerfile"               "$(Build.ArtifactStagingDirectory)\drop\"
        if exist       "$(Build.SourcesDirectory)\.dockerignore" copy /Y  "$(Build.SourcesDirectory)\.dockerignore"  "$(Build.ArtifactStagingDirectory)\drop\"
        if exist       "$(Build.SourcesDirectory)\.env.production" copy /Y "$(Build.SourcesDirectory)\.env.production" "$(Build.ArtifactStagingDirectory)\drop\"
        if exist       "$(Build.SourcesDirectory)\web.config" copy /Y "$(Build.SourcesDirectory)\web.config" "$(Build.ArtifactStagingDirectory)\drop\"
      displayName: 'Prepare FE artifacts'

    - task: PublishBuildArtifacts@1
      displayName: 'Publish FE artifact'
      inputs:
        PathtoPublish: '$(Build.ArtifactStagingDirectory)\drop'
        ArtifactName: '$(artifactName)'
        publishLocation: 'Container'

# -------------------- DEPLOY --------------------
- stage: Deploy_Dev
  displayName: Deploy FE to Gomoney-Dev
  dependsOn: Build
  jobs:

  # Manual approval gate
  - job: WaitForApproval
    displayName: 'Approval: Deploy FE to Gomoney-Dev'
    pool: server
    steps:
    - task: ManualValidation@0
      inputs:
        instructions: |
          Review the FE build. Approve to deploy to the DEV VM.
          This will build the Docker image **on the VM** and (re)start the container.
        onTimeout: 'reject'
        timeout: '12:00:00'

  # Actual deployment on the DEV VM
  - deployment: DeployToVM
    displayName: 'Build & Run FE container on DEV VM'
    dependsOn: WaitForApproval
    environment:
      name: 'Gomoney-Dev'          # Environment that targets your dev VM
      resourceType: 'virtualMachine'
      resourceName: 'SC-WORKSTATION'  # Exact VM resource name in that environment
    strategy:
      runOnce:
        deploy:
          steps:
          - task: DownloadPipelineArtifact@2
            displayName: 'Download FE artifact'
            inputs:
              buildType: current
              artifactName: '$(artifactName)'
              targetPath: '$(Pipeline.Workspace)\fe'

          # If you do NOT keep .env.production in repo, un-comment this block and
          # synthesize the file from pipeline secrets instead.
          # - powershell: |
          #     $envPath = Join-Path "$(Pipeline.Workspace)\fe" ".env.production"
          #     @"
          # SITEFINITY_URL=$(SITEFINITY_URL)
          # SITEFINITY_API_KEY=$(SITEFINITY_API_KEY)
          # NODE_ENV=production
          # "@ | Out-File -FilePath $envPath -Encoding UTF8 -Force
          #   Write-Host "Created .env.production at $envPath"
          #   displayName: 'Create .env.production from secrets'

          - powershell: |
              $ctx    = "$(Pipeline.Workspace)\fe"
              $tag    = "$(Build.BuildId)"
              $image  = "$(feImageName):$tag"
              $latest = "$(feImageName):latest"
              $cname  = "$(feContainer)"
              $port   = [int]"$(fePort)"

              Write-Host "Docker build context: $ctx"
              Push-Location $ctx

              # --- Preflight checks ---
              if (-not (Get-Command docker -ErrorAction SilentlyContinue)) {
                Write-Error "Docker CLI not found on the VM. Install Docker Desktop/Engine and retry."
                exit 1
              }

              try { docker version | Out-Null } catch {
                Write-Error "Docker daemon is not running on the VM."
                exit 1
              }

              $envFile = Join-Path $ctx ".env.production"
              if (-not (Test-Path $envFile)) {
                Write-Error ".env.production not found in $ctx. Either commit it or create it from pipeline secrets (see commented block)."
                exit 1
              }

              # Ensure a .dockerignore exists (helps speed by shrinking context)
              $di = Join-Path $ctx ".dockerignore"
              if (-not (Test-Path $di)) {
                @"
                node_modules
                .next/cache
                .git
                .github
                .vscode
                **/*.log
                npm-debug.log*
                yarn.lock
                .DS_Store
                "*.md"
                "*.map"
                "*.tgz"
                .env*
                "!/.env.production"
                "@ | Out-File -FilePath $di -Encoding UTF8 -Force
                Write-Host "Created default .dockerignore"
              }

              # --- Build image locally on the VM (caches will be reused automatically) ---
              # Tip: use --pull the very first time to refresh the base image, then remove it for speed
              docker build -t $image .

              if ($LASTEXITCODE -ne 0) {
                Write-Error "docker build failed with code $LASTEXITCODE"
                exit $LASTEXITCODE
              }

              # Tag as 'latest' for convenience
              docker tag $image $latest

              # Stop/remove previous container if exists
              $existing = (docker ps -aq -f "name=$cname")
              if ($existing) {
                docker stop $cname | Out-Null
                docker rm   $cname | Out-Null
              }

              # Ensure the IIS reverse-proxy site path exists (web.config already placed there)
              if (-not (Test-Path "$(feSiteRoot)")) {
                New-Item -ItemType Directory -Path "$(feSiteRoot)" | Out-Null
              }

              # Run container
              docker run -d --name $cname `
                -p ${port}:3000 `
                --env-file .env.production `
                --restart unless-stopped `
                $latest

              if ($LASTEXITCODE -ne 0) {
                Write-Error "docker run failed with code $LASTEXITCODE"
                exit $LASTEXITCODE
              }

              # --- Health check with retries ---
              $ok = $false
              for ($i=1; $i -le 20; $i++) {
                try {
                  $resp = Invoke-WebRequest -Uri "http://localhost:$port/api/health" -UseBasicParsing -TimeoutSec 3
                  if ($resp.StatusCode -ge 200 -and $resp.StatusCode -lt 500) {
                    $ok = $true
                    break
                  }
                } catch { Start-Sleep -Seconds 2 }
                Start-Sleep -Seconds 1
              }

              if (-not $ok) {
                Write-Host "Container didn't pass health-check. Showing last 200 log lines:"
                docker logs --tail 200 $cname || $true
                Write-Error "Health check failed for http://localhost:$port/api/health"
                exit 1
              }

              Pop-Location
            displayName: 'docker build & run (local, no registry)'

          # (Optional) bounce the IIS pool hosting the reverse proxy web.config if needed
          - powershell: |
              Import-Module WebAdministration
              try {
                Restart-WebAppPool -Name "DefaultAppPool" -ErrorAction SilentlyContinue
              } catch {}
            displayName: 'Recycle IIS (optional)'