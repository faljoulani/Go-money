trigger: none
pr: none

variables:
  sqlServerName: 'SC-Workstation'
  sqlDatabaseName: 'preprodgomoney'
  sqlUserName: 'sitefinity'
  backupDirectory: 'C:\\temp'
  bacpacBaseName: 'preprodgomoney'
  commandTimeoutSeconds: 1200

stages:
  - stage: Backup
    displayName: Export preprodgomoney bacpac
    jobs:
      - deployment: ExportBacpac
        displayName: Run sqlpackage export on SC-WORKSTATION
        environment:
          name: 'Gomoney-Dev'
          resourceType: 'virtualMachine'
          resourceName: 'SC-WORKSTATION'
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: none
                - task: PowerShell@2
                  displayName: Export database to bacpac
                  env:
                    SQLPACKAGE_PASSWORD: $(SqlPassword)
                  inputs:
                    targetType: inline
                    script: |
                      if (-not [bool]::Parse('$(System.Debug)')) {
                        $ProgressPreference = 'SilentlyContinue'
                      }

                      Write-Host "Preparing to export database bacpac"

                      $password = $env:SQLPACKAGE_PASSWORD
                      if ([string]::IsNullOrWhiteSpace($password)) {
                        throw 'Set the secret pipeline variable "SqlPassword" before running this pipeline.'
                      }

                      $targetDirectory = '$(backupDirectory)'
                      Write-Host "Backup directory: $targetDirectory"
                      if (-not (Test-Path -LiteralPath $targetDirectory)) {
                        Write-Host "Directory does not exist. Creating..."
                        New-Item -ItemType Directory -Path $targetDirectory -Force | Out-Null
                      } else {
                        Write-Host "Directory already exists."
                      }

                      $timestamp = Get-Date -Format 'yyyyMMdd-HHmmss'
                      $targetFilePath = Join-Path $targetDirectory "$(bacpacBaseName)-$timestamp.bacpac"

                      Write-Host "Export configuration:"
                      Write-Host "  Server   : $(sqlServerName)"
                      Write-Host "  Database : $(sqlDatabaseName)"
                      Write-Host "  Username : $(sqlUserName)"
                      Write-Host "  Target   : $targetFilePath"
                      Write-Host "  Timeout  : $(commandTimeoutSeconds) seconds"

                      function Get-SqlPackagePath {
                        param(
                          [string]$ExplicitPath,
                          [string[]]$CandidatePaths,
                          [string[]]$SearchRoots
                        )

                        Write-Host "[sqlpackage] Resolving sqlpackage.exe"

                        $resolved = @()
                        $order = 0

                        $addCandidate = {
                          param(
                            [string]$Path,
                            [string]$Source,
                            [bool]$IsExplicit
                          )

                          if ([string]::IsNullOrWhiteSpace($Path)) { return }

                          try {
                            $resolvedItems = Resolve-Path -Path $Path -ErrorAction Stop
                          } catch {
                            Write-Host "[sqlpackage]   not found: $Path"
                            return
                          }

                          foreach ($item in $resolvedItems) {
                            $resolvedPath = $item.Path

                            if ($resolved | Where-Object { $_.Path -eq $resolvedPath }) {
                              continue
                            }

                            $fileVersionInfo = $null
                            $versionText = $null
                            $parsedVersion = $null
                            try {
                              $fileVersionInfo = [System.Diagnostics.FileVersionInfo]::GetVersionInfo($resolvedPath)
                              $versionText = $fileVersionInfo.FileVersion
                            } catch {
                            }

                            if ($versionText) {
                              try {
                                $parsedVersion = [version]$versionText
                              } catch {
                                $parsedVersion = $null
                              }
                            }

                            if (-not $parsedVersion) {
                              $parsedVersion = [version]'0.0.0.0'
                            }

                            $versionDisplay = $versionText
                            if (-not $versionDisplay) {
                              $versionDisplay = 'unknown'
                            }

                            Write-Host "[sqlpackage]   candidate -> Path: $resolvedPath | Source: $Source | Version: $versionDisplay"

                            $resolved += [pscustomobject]@{
                              Path        = $resolvedPath
                              Source      = $Source
                              Explicit    = $IsExplicit
                              Version     = $parsedVersion
                              RawVersion  = $versionText
                              Order       = $order
                            }

                            $order++
                          }
                        }

                        if ($ExplicitPath -and $ExplicitPath -ne '$(SqlPackagePath)') {
                          Write-Host "[sqlpackage] Explicit variable provided: $ExplicitPath"
                          & $addCandidate $ExplicitPath 'explicit-variable' $true
                        }

                        foreach ($candidate in $CandidatePaths) {
                          if ([string]::IsNullOrWhiteSpace($candidate)) { continue }
                          Write-Host "[sqlpackage] Checking candidate path: $candidate"
                          & $addCandidate $candidate 'candidate' $false
                        }

                        foreach ($root in $SearchRoots) {
                          if (-not (Test-Path -LiteralPath $root)) {
                            Write-Host "[sqlpackage] Skipping missing search root: $root"
                            continue
                          }

                          Write-Host "[sqlpackage] Searching under root: $root"
                          try {
                            $matches = Get-ChildItem -Path $root -Filter sqlpackage.exe -File -Recurse -ErrorAction Stop
                          } catch {
                            Write-Host "[sqlpackage]   search error in $root : $($_.Exception.Message)"
                            $matches = @()
                          }

                          foreach ($match in $matches) {
                            & $addCandidate $match.FullName "search:$root" $false
                          }
                        }

                        if (-not $resolved) {
                          return $null
                        }

                        $explicitMatch = $resolved | Where-Object { $_.Explicit } | Select-Object -First 1
                        if ($explicitMatch) {
                          Write-Host "[sqlpackage] Selecting explicit path: $($explicitMatch.Path)"
                          return $explicitMatch.Path
                        }

                        $sorted = $resolved | Sort-Object -Property @{ Expression = 'Version'; Descending = $true }, @{ Expression = 'Order'; Descending = $false }
                        $best = $sorted | Select-Object -First 1
                        if ($best) {
                          $bestVersionDisplay = $best.RawVersion
                          if (-not $bestVersionDisplay) {
                            $bestVersionDisplay = 'unknown'
                          }

                          Write-Host "[sqlpackage] Selecting highest version path: $($best.Path) (version: $bestVersionDisplay)"
                          return $best.Path
                        }

                        return $null
                      }

                      $wingetCandidates = @()
                      if ($env:LOCALAPPDATA) {
                        $wingetCandidates += (Join-Path $env:LOCALAPPDATA 'Microsoft\WinGet\Packages\Microsoft.SqlPackage_*\sqlpackage.exe')
                      }
                      $wingetCandidates += 'C:\\Users\\*\\AppData\\Local\\Microsoft\\WinGet\\Packages\\Microsoft.SqlPackage_*\\sqlpackage.exe'

                      $candidatePaths = @(
                        '$(SqlPackagePath)'
                        'C:\\Program Files\\SqlPackage\\sqlpackage.exe'
                        'C:\\Program Files\\Microsoft SQL Server\\160\\DAC\\bin\\sqlpackage.exe'
                        'C:\\Program Files\\Microsoft SQL Server\\150\\DAC\\bin\\sqlpackage.exe'
                        'C:\\Program Files\\Microsoft SQL Server\\140\\DAC\\bin\\sqlpackage.exe'
                        'C:\\Program Files (x86)\\Microsoft SQL Server\\160\\DAC\\bin\\sqlpackage.exe'
                        'C:\\Program Files (x86)\\Microsoft SQL Server\\150\\DAC\\bin\\sqlpackage.exe'
                        'C:\\Program Files (x86)\\Microsoft SQL Server\\140\\DAC\\bin\\sqlpackage.exe'
                      ) + $wingetCandidates

                      $candidatePaths = $candidatePaths | Where-Object { $_ -and $_ -ne '$(SqlPackagePath)' } | Select-Object -Unique

                      $searchRoots = @(
                        'C:\\Program Files\\SqlPackage'
                        'C:\\Program Files\\Microsoft SQL Server'
                        'C:\\Program Files (x86)\\Microsoft SQL Server'
                        'C:\\Users'
                      )

                      $sqlPackagePath = Get-SqlPackagePath -ExplicitPath '$(SqlPackagePath)' -CandidatePaths $candidatePaths -SearchRoots $searchRoots
                      if (-not $sqlPackagePath) {
                        throw "sqlpackage not found. Install the SQL Server Data-Tier Application Framework (DacFx) or provide sqlpackage.exe on PATH."
                      }

                      Write-Host "[sqlpackage] Using executable: $sqlPackagePath"
                      try {
                        $fileInfo = [System.Diagnostics.FileVersionInfo]::GetVersionInfo($sqlPackagePath)
                        Write-Host "[sqlpackage] File version : $($fileInfo.FileVersion)"
                        Write-Host "[sqlpackage] Product name : $($fileInfo.ProductName)"
                        Write-Host "[sqlpackage] Product version: $($fileInfo.ProductVersion)"
                      } catch {
                        Write-Host "[sqlpackage] Unable to read file version info: $($_.Exception.Message)"
                      }

                      $arguments = @(
                        '/Action:Export'
                        '/SourceTrustServerCertificate:true'
                        "/SourceServerName:$(sqlServerName)"
                        "/SourceDatabaseName:$(sqlDatabaseName)"
                        "/SourceUser:$(sqlUserName)"
                        "/SourcePassword:$password"
                        "/TargetFile:$targetFilePath"
                        "/p:CommandTimeout=$(commandTimeoutSeconds)"
                      )

                      Write-Host "Starting sqlpackage export..."
                      & $sqlPackagePath @arguments

                      if ($LASTEXITCODE -ne 0) {
                        throw "sqlpackage failed with exit code $LASTEXITCODE"
                      }

                      Write-Host "sqlpackage export completed successfully."

                      if (Test-Path -LiteralPath $targetFilePath) {
                        $fileInfo = Get-Item -LiteralPath $targetFilePath
                        Write-Host "Generated file: $($fileInfo.FullName)"
                        Write-Host "File size    : $([Math]::Round($fileInfo.Length / 1MB, 2)) MB ($($fileInfo.Length) bytes)"
                        Write-Host "Created time : $($fileInfo.CreationTimeUtc.ToString('u')) UTC"
                      } else {
                        Write-Warning "Expected bacpac file not found at $targetFilePath"
                      }
